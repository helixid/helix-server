name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # helix-api and its examples/e2e depend on @helixid/sdk-js and
      # @helixid/did-hedera as pnpm git+path dependencies pointing at the
      # (currently private) helix-sdk-js repo, e.g.:
      #   "@helixid/sdk-js": "github:helixid/helix-sdk-js#path:helix-sdk-js"
      # A plain `git clone` of a private repo needs auth that the default
      # GITHUB_TOKEN does not grant across repos, so pnpm's install would
      # fail here with a 404/auth error even though checkout of *this*
      # repo succeeded. HELIXID_CROSS_REPO_TOKEN must be a PAT (classic,
      # `repo` scope, or fine-grained with contents:read) belonging to a
      # user/machine account with read access to helixid/helix-sdk-js,
      # stored as a repo or org secret. If helix-sdk-js is made public,
      # or once these packages are published to a registry, this step
      # (and the secret) can be removed.
      # NOTE: url.<base>.insteadOf is a multi-valued git config key, so each
      # rewrite MUST be added with `--add` — plain `git config <key> <val>`
      # replaces the single existing value instead of appending, which
      # silently dropped the first two rewrites here in an earlier version
      # of this step (only the last insteadOf survived, so SSH-form
      # dependency URLs still went out over real SSH and failed with
      # "cannot run ssh: No such file or directory" in Install dependencies).
      - name: Configure git for private cross-repo dependency
        run: |
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      # examples/e2e-travel-concierge and examples/e2e-travel-concierge-hosted
      # both depend on @helixid/sdk-js and @helixid/mcp via *local*
      # file:../../../helix-sdk-js/... paths (a true sibling-repo checkout on
      # a dev machine with all four split repos side by side) rather than
      # the git+path specs the rest of the workspace uses -- this CI job
      # only checks out helix-server, so that directory never exists here
      # and a plain `pnpm install` fails with ENOENT trying to scandir it.
      # Excluded from install entirely; neither has a build/test:non-live
      # script, so nothing later in this workflow needs them installed.
      # (See each one's own package.json/docker-compose.yml/README.md for
      # the real, sibling-checkout- or vendoring-based install paths.)
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile --filter '!@helixid/example-e2e-travel-concierge' --filter '!@helixid/example-e2e-travel-concierge-hosted'

      - name: Build
        run: pnpm run workspace:build

      # Everything that needed a live Postgres/tests/live (the DID/VC/VP/
      # agent HTTP-level suite) moved to @helixid/core along with the code
      # it exercises — this repo's own remaining tests (services/auth) use
      # in-memory repositories and need no database at all.
      #
      # @helixid/example-e2e-consent-demo is excluded: its tests (and much
      # of agent/ and sp-shared/) still import from @helixid/core, which
      # was retired and folded into per-package copies in an earlier,
      # unrelated refactor (07366cb in the original monorepo) that never
      # updated this example. Pre-existing breakage, carried over from the
      # monorepo split, tracked as a follow-up rather than papered over.
      - name: Test
        run: pnpm run workspace:test:non-live
        env:
          NODE_ENV: test
          HELIX_SIGNING_KEY: ${{ secrets.HELIX_SIGNING_KEY }}
          API_BASE_URL: http://localhost:3000
          ENROLLMENT_TOKEN_TTL_SECONDS: 900
          CHALLENGE_TTL_SECONDS: 300
          VP_TTL_SECONDS: 300
          AUDIT_LOG_DESTINATION: stdout
